<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Echo Diary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#15120f;color:#e9dfcf;font-family:Georgia,"Noto Serif TC",serif;display:flex;align-items:center;justify-content:center}
.diary{position:relative;width:min(94vw,900px);height:min(92vh,680px);background:#d9c7a6;border-radius:8px;box-shadow:0 18px 55px #0008;overflow:hidden;color:#392c20}
.paper{position:absolute;inset:0;padding:7% 8%}
h1{margin:0;font-size:clamp(25px,5vw,44px);letter-spacing:.16em}
.sub{margin-top:6px;font-size:13px;opacity:.65}
.page{position:absolute;top:7%;right:8%;font-size:12px;opacity:.55}
#canvas{position:absolute;left:5%;top:18%;width:90%;height:58%;touch-action:none;cursor:crosshair}
.controls{position:absolute;left:8%;right:8%;bottom:7%;display:flex;gap:10px;justify-content:flex-end}
button{border:1px solid #6d5945;background:#eadcc4;color:#392c20;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px}
button:active{transform:scale(.98)}
.reply{position:absolute;left:11%;right:11%;top:35%;min-height:90px;text-align:center;font-size:clamp(17px,3vw,25px);line-height:1.7;opacity:0;pointer-events:none;transition:opacity .35s}
.reply.show{opacity:1}
#fireworks{position:absolute;inset:0;pointer-events:none;display:none}
#fireworks.show{display:block}
.hint{position:absolute;left:8%;bottom:13%;font-size:12px;opacity:.5}
</style>
</head>
<body>
<div class="diary" id="diary">
  <canvas id="fireworks"></canvas>
  <div class="paper">
    <h1>ECHO DIARY</h1>
    <div class="sub">直接在紙上手寫，不需要鍵盤。</div>
    <div class="page">PAGE 01</div>
    <canvas id="canvas"></canvas>
    <div class="reply" id="reply"></div>
    <div class="hint">寫完後，封存這一段。</div>
    <div class="controls">
      <button id="clear">清除</button>
      <button id="seal">封存這一段</button>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const reply=document.getElementById('reply'), clearBtn=document.getElementById('clear'), seal=document.getElementById('seal');
let drawing=false, last=null, points=[];

function resizeCanvas(){
  const r=canvas.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
  const old=document.createElement('canvas'); old.width=canvas.width; old.height=canvas.height;
  if(canvas.width&&canvas.height) old.getContext('2d').drawImage(canvas,0,0);
  canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d);
  ctx.setTransform(d,0,0,d,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=3.2;
  if(old.width) ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
}
new ResizeObserver(resizeCanvas).observe(canvas);

function pos(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}}
function drawSmooth(p){
  if(!last){last=p;points=[p];return}
  const mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.quadraticCurveTo(last.x,last.y,mid.x,mid.y);ctx.stroke();
  last=p; points.push(p);
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing=true; last=pos(e); points=[last];
  ctx.beginPath();ctx.arc(last.x,last.y,1.6,0,Math.PI*2);ctx.fill();
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(!drawing)return; e.preventDefault(); drawSmooth(pos(e));
},{passive:false});
function end(e){if(!drawing)return;e.preventDefault();drawing=false;last=null;points=[];try{canvas.releasePointerCapture(e.pointerId)}catch{}}
canvas.addEventListener('pointerup',end,{passive:false});
canvas.addEventListener('pointercancel',end,{passive:false});
canvas.addEventListener('pointerleave',e=>{if(e.buttons===0)end(e)},{passive:false});

clearBtn.onclick=()=>ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

async function sealDiary(){
  if(!canvas.width)return;
  seal.disabled=true;
  reply.classList.remove('show');
  // Send only the drawing area, enlarged by the server.
  const image=canvas.toDataURL('image/png');
  try{
    const res=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,page:1})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'request failed');
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
    reply.textContent='';
    reply.classList.add('show');
    let i=0; const text=data.reply||'……';
    const timer=setInterval(()=>{reply.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer)},32);
    if(data.birthday) launchFireworks();
    setTimeout(()=>reply.classList.remove('show'),5200);
  }catch(err){
    reply.textContent='這一頁沒有聽清楚，再寫一次吧。';
    reply.classList.add('show');
    setTimeout(()=>reply.classList.remove('show'),3000);
  }finally{seal.disabled=false}
}

// Prevent Safari gesture/double-tap zoom.
['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now(); if(now-lastTouch<300)e.preventDefault(); lastTouch=now;
},{passive:false});

const fw=document.getElementById('fireworks'), fctx=fw.getContext('2d');
function launchFireworks(){
  fw.width=fw.clientWidth*devicePixelRatio; fw.height=fw.clientHeight*devicePixelRatio;
  fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const W=fw.clientWidth,H=fw.clientHeight, sparks=[];
  for(let k=0;k<7;k++){
    const cx=W*(.15+Math.random()*.7), cy=H*(.18+Math.random()*.42);
    for(let i=0;i<55;i++){
      const a=Math.random()*Math.PI*2, s=1.2+Math.random()*3.8;
      sparks.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:45+Math.random()*35});
    }
  }
  fw.classList.add('show');
  function frame(){
    fctx.clearRect(0,0,W,H);
    for(const p of sparks){
      if(p.life<=0)continue;
      p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life-=1;
      fctx.globalAlpha=Math.max(0,p.life/75);
      fctx.beginPath();fctx.arc(p.x,p.y,2,0,Math.PI*2);fctx.fill();
    }
    fctx.globalAlpha=1;
    if(sparks.some(p=>p.life>0))requestAnimationFrame(frame);
    else fw.classList.remove('show');
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
