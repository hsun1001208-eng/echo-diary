<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Echo Diary V8</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{background:#17130f;color:#eee8dc;font-family:system-ui,"Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0e0c0a;border-bottom:1px solid #4d4032}
h1{font-size:19px;margin:0;letter-spacing:2px}.status{font-size:13px;opacity:.72}
main{height:calc(100dvh - 60px);display:grid;place-items:center;padding:16px;touch-action:none}
.diary{width:min(900px,96vw);height:min(820px,calc(100dvh - 92px));padding:38px 46px 22px;background:#d9c79f;color:#302519;box-shadow:0 20px 70px #0008;border-radius:4px;position:relative;display:flex;flex-direction:column;touch-action:none}
.page{position:absolute;top:15px;right:24px;font-size:12px;opacity:.55}
#ink{width:100%;flex:1;min-height:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
button{border:1px solid #4b3a28;background:#efe1bc;color:#302519;padding:9px 15px;border-radius:5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}.hint{font-size:12px;opacity:.65}
.reply{position:absolute;left:46px;right:46px;top:145px;bottom:110px;display:none;align-items:center;justify-content:center;text-align:center;font-family:serif;font-size:21px;line-height:1.8;color:#241b12;white-space:pre-wrap;padding:25px;pointer-events:none}
.reply.show{display:flex}.fade{animation:fade 4.5s ease forwards}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}
@media(max-width:600px){
 header{height:54px;padding:0 14px}.status{font-size:12px}
 main{height:calc(100dvh - 54px);padding:8px}
 .diary{width:100%;height:calc(100dvh - 70px);padding:30px 16px 12px}
 .reply{left:16px;right:16px;top:95px;bottom:75px;font-size:18px}
 .hint{display:none}button{padding:8px 12px}
}

#fireworks{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:none;z-index:0!important;mix-blend-mode:screen;background:transparent}
#inkveil{position:fixed;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(30,20,10,.12),rgba(0,0,0,.62));transition:.6s}
#inkblob{position:fixed;width:18px;height:18px;border-radius:50%;background:#120f0c;filter:blur(2px);opacity:0;pointer-events:none}
@keyframes blob{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(3)}100%{opacity:0;transform:scale(0)}}
body{background:linear-gradient(#1a130d,#080605);perspective:1200px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 15%,rgba(255,220,140,.1),transparent 30%),radial-gradient(circle at 80% 20%,rgba(255,180,90,.08),transparent 35%);animation:flicker 4s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.8}to{opacity:1}}
#reply{transition:filter .5s ease}
#reply.magic{filter:drop-shadow(0 0 8px rgba(255,240,180,.8))}
</style>
</head>
<body><div id="inkveil"></div><div id="inkblob"></div><canvas id="fireworks"></canvas>
<header><h1>ECHO DIARY</h1><div class="status" id="status">可以開始書寫</div></header>
<main><section class="diary">
<div class="page">PAGE <span id="page">01</span></div>
<canvas id="ink"></canvas>
<div id="reply" class="reply"></div>
<div class="controls"><span class="hint">直接在紙上手寫，不需要鍵盤。</span><div><button id="clear">清除</button> <button id="send">封存這一段</button></div></div>
</section></main>
<script>
const c=document.querySelector('#ink'),ctx=c.getContext('2d'),send=document.querySelector('#send'),clear=document.querySelector('#clear'),status=document.querySelector('#status'),reply=document.querySelector('#reply');
let drawing=false,hasInk=false,page=1;

// Stronger iOS/Safari zoom prevention while keeping the canvas writable.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=320)e.preventDefault();lastTouchEnd=now},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

function resize(){
 const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));
 ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#241b12';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
}
addEventListener('resize',resize);requestAnimationFrame(resize);
function pos(e){const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='touch'&&e.isPrimary===false)return;c.setPointerCapture(e.pointerId);drawing=true;hasInk=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)},{passive:false});
c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const[x,y]=pos(e);const mx=(lastX+x)/2,my=(lastY+y)/2;ctx.quadraticCurveTo(lastX,lastY,mx,my);ctx.stroke();ctx.beginPath();ctx.moveTo(mx,my);lastX=x;lastY=y},{passive:false});
function up(e){drawing=false;try{c.releasePointerCapture(e.pointerId)}catch{}}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')up(e)});
clear.addEventListener('click',()=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);hasInk=false});

// Export only the actual ink, on an opaque high-contrast background, cropped and enlarged.
// This gives the vision model a much cleaner handwriting image than the full diary page.
function image(){
 const w=c.clientWidth,h=c.clientHeight;
 const src=ctx.getImageData(0,0,c.width,c.height),data=src.data,d= c.width/w;
 let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
   const i=(y*c.width+x)*4;
   if(data[i+3]>25 && data[i]<100){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
 }
 if(maxX<0)return preprocessCanvas(c).toDataURL('image/png');
 const pad=Math.round(32*d);
 minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(c.width-1,maxX+pad);maxY=Math.min(c.height-1,maxY+pad);
 const cw=maxX-minX+1,ch=maxY-minY+1,scale=Math.min(2.5,1600/Math.max(cw,ch));
 const out=document.createElement('canvas');out.width=Math.max(600,Math.round(cw*scale));out.height=Math.max(260,Math.round(ch*scale));
 const o=out.getContext('2d');o.fillStyle='#fffdf6';o.fillRect(0,0,out.width,out.height);o.imageSmoothingEnabled=false;
 const temp=document.createElement('canvas');temp.width=c.width;temp.height=c.height;temp.getContext('2d').putImageData(src,0,0);
 o.drawImage(temp,minX,minY,cw,ch,0,0,out.width,out.height);
 return out.toDataURL('image/png');
}
function clearInk(){ctx.clearRect(0,0,c.clientWidth,c.clientHeight);hasInk=false}
function type(text){
 reply.textContent='';cinematicIntro();reply.className='reply show';let i=0;
 const t=setInterval(()=>{reply.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(t)},22);
 setTimeout(()=>{reply.classList.add('fade');setTimeout(()=>{reply.className='reply';reply.textContent=''},4700)},Math.max(4300,text.length*22+1600));
}
send.addEventListener('click',async()=>{
 if(!hasInk||send.disabled)return;
 send.disabled=clear.disabled=true;status.textContent='正在讀取你的字……';
 try{
  const r=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:image(),page})});
  if(!r.ok)throw new Error(await r.text());
  const data=await r.json();clearInk();status.textContent='日記已回答';type(data.reply||'我還沒有看清這一頁。');if(data.special==='birthday')fireworks();
  page++;document.querySelector('#page').textContent=String(page).padStart(2,'0');
 }catch(e){console.error(e);status.textContent='AI 暫時無法回應';alert('AI 暫時沒有回應，請稍後再試。')}
 finally{send.disabled=clear.disabled=false}
});

const fw=document.getElementById('fireworks'),fwctx=fw.getContext('2d');
const veil=document.getElementById('inkveil'),blob=document.getElementById('inkblob');
document.addEventListener('mousemove',e=>{const p=document.querySelector('#book,#diary,.paper');if(!p)return;p.style.transform=`rotateX(${(innerHeight/2-e.clientY)/35}deg) rotateY(${(e.clientX-innerWidth/2)/35}deg)`});
function cinematicIntro(){veil.style.opacity='1';const r=reply.getBoundingClientRect();blob.style.left=(r.left+r.width/2-9)+'px';blob.style.top=(r.top+18)+'px';blob.style.animation='none';void blob.offsetWidth;blob.style.animation='blob .9s ease forwards';setTimeout(()=>veil.style.opacity='0',900);reply.classList.add('magic')}
function preprocessCanvas(src){const t=document.createElement('canvas');t.width=src.width;t.height=src.height;const c=t.getContext('2d');c.filter='contrast(180%) brightness(115%)';c.drawImage(src,0,0);const img=c.getImageData(0,0,t.width,t.height),d=img.data;for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3,v=g>205?255:0;d[i]=d[i+1]=d[i+2]=v}c.putImageData(img,0,0);c.globalCompositeOperation='multiply';c.drawImage(t,-1,0);c.drawImage(t,1,0);return t}
function fireworks(){fw.width=innerWidth;fw.height=innerHeight;fw.style.display='block';const P=[],R=[];for(let i=0;i<36;i++)R.push({x:Math.random()*fw.width,y:fw.height+Math.random()*200,tx:Math.random()*fw.width,ty:Math.random()*fw.height*.45+40,v:4+Math.random()*2});(function a(){fwctx.fillStyle='rgba(0,0,0,.08)';fwctx.fillRect(0,0,fw.width,fw.height);R.forEach(r=>{if(r.done)return;let dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);if(d<8){r.done=true;for(let k=0;k<220;k++){let A=Math.random()*Math.PI*2,S=2+Math.random()*8;P.push({x:r.x,y:r.y,vx:Math.cos(A)*S,vy:Math.sin(A)*S,l:120})}}else{r.x+=dx/d*r.v;r.y+=dy/d*r.v;fwctx.fillStyle='white';fwctx.fillRect(r.x,r.y,2,8)}});fwctx.globalCompositeOperation='lighter';P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.l--;fwctx.fillStyle=`hsla(${(p.l*4)%360},100%,60%,${p.l/120})`;fwctx.beginPath();fwctx.arc(p.x,p.y,2.2,0,Math.PI*2);fwctx.fill()});fwctx.globalCompositeOperation='source-over';if(P.some(p=>p.l>0)||R.some(r=>!r.done))requestAnimationFrame(a);else{fwctx.clearRect(0,0,fw.width,fw.height);fw.style.display='none'}})()}
</script>
</body>
</html>
