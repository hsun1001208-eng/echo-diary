<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo Diary V6</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#17130f;color:#eee8dc;font-family:system-ui,"Noto Sans TC",sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0e0c0a;border-bottom:1px solid #4d4032}
h1{font-size:20px;margin:0;letter-spacing:2px}.status{font-size:13px;opacity:.72}
main{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:24px}
.diary{width:min(900px,96vw);min-height:min(760px,88vh);padding:48px 52px;background:#d9c79f;color:#302519;box-shadow:0 20px 70px #0008;border-radius:4px;position:relative}
.page{position:absolute;top:20px;right:28px;font-size:12px;opacity:.55}
#ink{width:100%;height:560px;display:block;touch-action:none;cursor:crosshair}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
button{border:1px solid #4b3a28;background:#efe1bc;color:#302519;padding:10px 18px;border-radius:5px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;opacity:.65}.reply{position:absolute;left:52px;right:52px;top:170px;min-height:120px;display:none;align-items:center;justify-content:center;text-align:center;font-family:serif;font-size:22px;line-height:1.8;color:#241b12;white-space:pre-wrap}
.reply.show{display:flex}.fade{animation:fade 4.5s ease forwards}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}
@media(max-width:600px){.diary{padding:32px 22px}.reply{left:22px;right:22px;top:130px;font-size:18px}#ink{height:60vh}}
</style>
</head>
<body>
<header><h1>ECHO DIARY</h1><div class="status" id="status">可以開始書寫</div></header>
<main><section class="diary">
<div class="page">PAGE <span id="page">01</span></div>
<canvas id="ink"></canvas>
<div id="reply" class="reply"></div>
<div class="controls">
<span class="hint">直接在紙上手寫，不需要鍵盤。</span>
<div><button id="clear">清除</button> <button id="send">封存這一段</button></div>
</div>
</section></main>
<script>
const c=document.querySelector('#ink'),ctx=c.getContext('2d'),send=document.querySelector('#send'),
clear=document.querySelector('#clear'),status=document.querySelector('#status'),reply=document.querySelector('#reply');
let drawing=false,hasInk=false,page=1,points=[];
function resize(){
 const r=c.getBoundingClientRect(),d=devicePixelRatio||1;
 c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);
 ctx.strokeStyle='#241b12';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
}
addEventListener('resize',resize); resize();
function pos(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;hasInk=true;points=[];let [x,y]=pos(e);points.push([x,y]);ctx.beginPath();ctx.moveTo(x,y)});
c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let [x,y]=pos(e);points.push([x,y]);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y)});
function up(e){drawing=false}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
clear.addEventListener('click',()=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);hasInk=false;points=[]});
function image(){return c.toDataURL('image/png')}
function clearInk(){ctx.clearRect(0,0,c.clientWidth,c.clientHeight);hasInk=false;points=[]}
function type(text){
 reply.textContent='';reply.classList.add('show');let i=0;
 const t=setInterval(()=>{reply.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(t)},24);
 setTimeout(()=>{reply.classList.add('fade');setTimeout(()=>{reply.className='reply';reply.textContent=''},4800)},Math.max(4300,text.length*24+1800));
}
send.addEventListener('click',async()=>{
 if(!hasInk)return;
 send.disabled=clear.disabled=true;status.textContent='正在讀取你的手寫……';
 const img=image();
 try{
   const r=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:img,page})});
   if(!r.ok)throw new Error(await r.text());
   const data=await r.json(); clearInk(); status.textContent='日記已回答'; type(data.reply||'……');
   page++;document.querySelector('#page').textContent=String(page).padStart(2,'0');
 }catch(e){
   status.textContent='連線不到 AI 服務';
   alert('目前 AI 服務尚未連線。這個版本的前端已經完成，但要讓它真的讀懂中文手寫，還需要把後端部署到網路上。');
 }finally{send.disabled=clear.disabled=false}
});
</script>
</body>
</html>
