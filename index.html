<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Riddle's Diary - 湯姆瑞斗的日記</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }
    #canvas-fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .diary-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 650px;
      height: 80vh;
      background: #e8d8b8;
      background-image: radial-gradient(#d0be96 15%, transparent 16%);
      background-size: 20px 20px;
      border: 12px solid #2b1d0c;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0, 0, 0, 0.3);
      padding: 40px;
      display: flex;
      flex-direction: column;
    }
    .diary-header {
      text-align: center;
      font-size: 1.2rem;
      color: #5c4a38;
      letter-spacing: 2px;
      margin-bottom: 20px;
      border-bottom: 1px solid #b5a484;
      padding-bottom: 10px;
      font-weight: bold;
    }
    .conversation-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-right: 10px;
    }
    .message {
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 85%;
      word-wrap: break-word;
      transition: opacity 1.5s ease;
    }
    .user-message {
      align-self: flex-start;
      color: #1a0f00;
      font-style: italic;
    }
    .user-message.fade-out {
      opacity: 0;
    }
    .riddle-message {
      align-self: flex-end;
      color: #0b3d0b;
      font-weight: bold;
      opacity: 0;
      animation: fadeInInk 2.5s forwards;
    }
    @keyframes fadeInInk {
      0% { opacity: 0; filter: blur(4px); }
      100% { opacity: 1; filter: blur(0); }
    }
    .input-area {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #5c4a38;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      color: #2b1d0c;
      padding: 8px;
      outline: none;
    }
    button {
      background: #2b1d0c;
      color: #e8d8b8;
      border: none;
      padding: 8px 18px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s;
    }
    button:hover {
      background: #4a3418;
    }
  </style>
</head>
<body>

  <canvas id="canvas-fireworks"></canvas>

  <div class="diary-container">
    <div class="diary-header">T. M. RIDDLE</div>
    <div class="conversation-area" id="conversation"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="在日記本上寫字..." autocomplete="off" />
      <button onclick="handleSend()">寫下</button>
    </div>
  </div>

  <script>
    const conversation = document.getElementById('conversation');
    const userInput = document.getElementById('userInput');

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';

      // 顯示使用者寫下的字
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'message user-message';
      userMsgDiv.textContent = text;
      conversation.appendChild(userMsgDiv);
      conversation.scrollTop = conversation.scrollHeight;

      // 模擬墨水滲透消失（字體淡出）
      setTimeout(() => {
        userMsgDiv.classList.add('fade-out');
      }, 1500);

      // 判斷彩蛋或呼叫 AI
      if (text === '1024') {
        setTimeout(() => {
          triggerEasterEgg();
        }, 2000);
      } else {
        setTimeout(async () => {
          const reply = await fetchAIReply(text);
          showRiddleReply(reply);
        }, 2200);
      }
    }

    function showRiddleReply(replyText) {
      const riddleMsgDiv = document.createElement('div');
      riddleMsgDiv.className = 'message riddle-message';
      riddleMsgDiv.textContent = replyText;
      conversation.appendChild(riddleMsgDiv);
      conversation.scrollTop = conversation.scrollHeight;
    }

    // 彩蛋處理邏輯
    function triggerEasterEgg() {
      showRiddleReply("吳悠生日快樂");
      startFireworks();
    }

    // AI 回應介接 (可連線後端 API /api/chat)
    async function fetchAIReply(prompt) {
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt })
        });
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        return data.reply;
      } catch (err) {
        // 後端未連接或展示時的備用回應邏輯
        const fallbackReplies = [
          "你好，我是湯姆·瑞斗。你是怎麼拿到我的日記的？",
          "有些秘密，只有寫在紙上才能保存下來……",
          "我能感受到你的好奇心。你想知道霍格華茲的秘密嗎？",
          "對我坦白吧，我會為你保守秘密。"
        ];
        return fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
      }
    }

    // 煙火特效 Canvas 邏輯
    const canvas = document.getElementById('canvas-fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startFireworks() {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          createFirework(
            Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
            Math.random() * (canvas.height * 0.5) + canvas.height * 0.1
          );
        }, i * 350);
      }
      animateFireworks();
    }

    function createFirework(x, y) {
      const count = 100;
      const colors = ['#ff4d4d', '#ffdb4d', '#4dff4d', '#4dffff', '#ff4dff', '#ffffff'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color
        });
      }
    }

    function animateFireworks() {
      ctx.fillStyle = 'rgba(18, 18, 18, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // 重力效果
        p.alpha -= 0.012;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.fill();

        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateFireworks);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>
</body>
</html>
