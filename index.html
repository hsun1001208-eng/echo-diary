<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Riddle's Diary - 湯姆瑞斗的手寫日記</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }
    #canvas-fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .diary-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      height: 85vh;
      background: #e8d8b8;
      background-image: radial-gradient(#d0be96 15%, transparent 16%);
      background-size: 20px 20px;
      border: 12px solid #2b1d0c;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0, 0, 0, 0.3);
      padding: 25px;
      display: flex;
      flex-direction: column;
    }
    .diary-header {
      text-align: center;
      font-size: 1.2rem;
      color: #5c4a38;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid #b5a484;
      padding-bottom: 5px;
      font-weight: bold;
    }
    .conversation-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-right: 10px;
      position: relative;
    }
    .message {
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 85%;
      word-wrap: break-word;
      transition: opacity 1.5s ease;
    }
    .user-handwriting-img {
      max-width: 80%;
      height: auto;
      align-self: flex-start;
      filter: sepia(0.5) contrast(1.2);
      transition: opacity 1.5s ease;
    }
    .user-handwriting-img.fade-out {
      opacity: 0;
    }
    .riddle-message {
      align-self: flex-end;
      color: #0b3d0b;
      font-weight: bold;
      opacity: 0;
      animation: fadeInInk 2.5s forwards;
    }
    @keyframes fadeInInk {
      0% { opacity: 0; filter: blur(4px); }
      100% { opacity: 1; filter: blur(0); }
    }
    .handwrite-area {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(43, 29, 12, 0.05);
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #5c4a38;
    }
    canvas#drawing-canvas {
      width: 100%;
      height: 120px;
      background: transparent;
      cursor: crosshair;
      touch-action: none;
    }
    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      background: #2b1d0c;
      color: #e8d8b8;
      border: none;
      padding: 6px 14px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: background 0.3s;
    }
    button:hover {
      background: #4a3418;
    }
    button.clear-btn {
      background: #5c4a38;
    }
  </style>
  <!-- OCR 辨識庫 (辨識手寫 1024 特效) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <canvas id="canvas-fireworks"></canvas>

  <div class="diary-container">
    <div class="diary-header">T. M. RIDDLE</div>
    <div class="conversation-area" id="conversation"></div>
    
    <div class="handwrite-area">
      <canvas id="drawing-canvas"></canvas>
      <div class="btn-group">
        <button class="clear-btn" onclick="clearCanvas()">清除</button>
        <button onclick="handleSendHandwriting()">寫下墨跡</button>
      </div>
    </div>
  </div>

  <script>
    const conversation = document.getElementById('conversation');
    const drawCanvas = document.getElementById('drawing-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    let isDrawing = false;
    let hasDrawn = false;

    function initDrawCanvas() {
      drawCanvas.width = drawCanvas.offsetWidth;
      drawCanvas.height = drawCanvas.offsetHeight;
      drawCtx.strokeStyle = '#1a0f00';
      drawCtx.lineWidth = 3;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
    }
    window.addEventListener('resize', initDrawCanvas);
    setTimeout(initDrawCanvas, 100);

    function startDrawing(e) {
      isDrawing = true;
      hasDrawn = true;
      const pos = getPos(e);
      drawCtx.beginPath();
      drawCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPos(e);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    drawCanvas.addEventListener('mouseup', stopDrawing);
    drawCanvas.addEventListener('mouseleave', stopDrawing);

    drawCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    drawCanvas.addEventListener('touchend', stopDrawing);

    function clearCanvas() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      hasDrawn = false;
    }

    async function handleSendHandwriting() {
      if (!hasDrawn) return;

      const dataURL = drawCanvas.toDataURL('image/png');
      
      const img = document.createElement('img');
      img.src = dataURL;
      img.className = 'user-handwriting-img';
      conversation.appendChild(img);
      conversation.scrollTop = conversation.scrollHeight;

      clearCanvas();

      setTimeout(() => {
        img.classList.add('fade-out');
      }, 1500);

      // OCR 辨識手寫內容
      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(dataURL);
        await worker.terminate();
        const text = ret.data.text.trim();

        if (text.includes('1024')) {
          setTimeout(() => {
            triggerEasterEgg();
          }, 2000);
          return;
        }

        setTimeout(async () => {
          const reply = await fetchAIReply(text || "手寫筆跡");
          showRiddleReply(reply);
        }, 2200);

      } catch (err) {
        setTimeout(async () => {
          const reply = await fetchAIReply("手寫筆跡");
          showRiddleReply(reply);
        }, 2200);
      }
    }

    function showRiddleReply(replyText) {
      const riddleMsgDiv = document.createElement('div');
      riddleMsgDiv.className = 'message riddle-message';
      riddleMsgDiv.textContent = replyText;
      conversation.appendChild(riddleMsgDiv);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function triggerEasterEgg() {
      showRiddleReply("吳悠生日快樂");
      startFireworks();
    }

    async function fetchAIReply(prompt) {
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt })
        });
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        return data.reply;
      } catch (err) {
        const fallbackReplies = [
          "你好，我是湯姆·瑞斗。你是怎麼拿到我的日記的？",
          "有些秘密，只有寫在紙上才能保存下來……",
          "我能感受到你的好奇心。你想知道霍格華茲的秘密嗎？",
          "對我坦白吧，我會為你保守秘密。"
        ];
        return fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
      }
    }

    const canvas = document.getElementById('canvas-fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startFireworks() {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          createFirework(
            Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
            Math.random() * (canvas.height * 0.5) + canvas.height * 0.1
          );
        }, i * 350);
      }
      animateFireworks();
    }

    function createFirework(x, y) {
      const count = 100;
      const colors = ['#ff4d4d', '#ffdb4d', '#4dff4d', '#4dffff', '#ff4dff', '#ffffff'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color
        });
      }
    }

    function animateFireworks() {
      ctx.fillStyle = 'rgba(18, 18, 18, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.alpha -= 0.012;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.fill();

        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateFireworks);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>
</body>
</html>
