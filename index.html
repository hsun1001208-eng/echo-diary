<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Echo Diary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#15120f;color:#e9dfcf;font-family:Georgia,"Noto Serif TC",serif;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}
.diary{position:relative;width:min(94vw,900px);height:min(92vh,680px);background:#d9c7a6;border-radius:8px;box-shadow:0 18px 55px #0008;color:#392c20;overflow:hidden}
.paper{position:absolute;inset:0;padding:7% 8%}
h1{margin:0;font-size:clamp(25px,5vw,44px);letter-spacing:.16em}.sub{margin-top:6px;font-size:13px;opacity:.65}
.page{position:absolute;top:7%;right:8%;font-size:12px;opacity:.55}
#canvas{position:absolute;left:5%;top:18%;width:90%;height:58%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.controls{position:absolute;left:8%;right:8%;bottom:7%;display:flex;gap:10px;justify-content:flex-end}
button{border:1px solid #6d5945;background:#eadcc4;color:#392c20;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px;touch-action:manipulation}
button:disabled{opacity:.45}
.reply{position:absolute;left:11%;right:11%;top:35%;min-height:90px;text-align:center;font-size:clamp(17px,3vw,25px);line-height:1.7;opacity:0;pointer-events:none;transition:opacity .35s;white-space:pre-wrap}
.reply.show{opacity:1}.hint{position:absolute;left:8%;bottom:13%;font-size:12px;opacity:.5}
#fireworks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#fireworks.show{display:block}
</style>
</head>
<body>
<div class="diary">
<canvas id="fireworks"></canvas>
<div class="paper">
<h1>ECHO DIARY</h1><div class="sub">直接在紙上手寫，不需要鍵盤。</div><div class="page">PAGE 01</div>
<canvas id="canvas"></canvas><div class="reply" id="reply"></div><div class="hint">寫完後，封存這一段。</div>
<div class="controls"><button type="button" id="clear">清除</button><button type="button" id="seal">封存這一段</button></div>
</div></div>
<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),seal=document.getElementById('seal'),clear=document.getElementById('clear'),reply=document.getElementById('reply');
let drawing=false,last=null,ink=false,dpr=1;
function resize(){
 const r=c.getBoundingClientRect(),old=document.createElement('canvas');old.width=c.width;old.height=c.height;
 if(old.width)old.getContext('2d').drawImage(c,0,0);
 dpr=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));
 x.setTransform(dpr,0,0,dpr,0,0);x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
 if(old.width)x.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)
}
new ResizeObserver(resize).observe(c);
function p(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function draw(e){
 const es=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 for(const q of es){const a=p(q);
  if(last){x.beginPath();x.moveTo(last.x,last.y);x.lineTo(a.x,a.y);x.stroke()}
  else{x.beginPath();x.arc(a.x,a.y,1.5,0,Math.PI*2);x.fill()}
  last=a;ink=true;
 }
}
c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=null;c.setPointerCapture(e.pointerId);draw(e)},{passive:false});
c.addEventListener('pointermove',e=>{if(drawing){e.preventDefault();draw(e)}},{passive:false});
function end(e){if(!drawing)return;e.preventDefault();drawing=false;last=null;try{c.releasePointerCapture(e.pointerId)}catch(_){}}
c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});
clear.onclick=()=>{x.clearRect(0,0,c.clientWidth,c.clientHeight);ink=false;reply.classList.remove('show')};

seal.onclick=async()=>{
 if(!ink||seal.disabled)return;
 seal.disabled=true;clear.disabled=true;reply.classList.remove('show');
 try{
  const r=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:c.toDataURL('image/png'),page:1})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);
  x.clearRect(0,0,c.clientWidth,c.clientHeight);ink=false;
  const t=d.reply||'我沒有聽清楚這一筆，再寫一次吧。';
  reply.textContent='';reply.classList.add('show');
  let i=0;const timer=setInterval(()=>{reply.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(timer)},28);
  if(d.birthday===true)launchFireworks();
  setTimeout(()=>reply.classList.remove('show'),5200);
 }catch(e){
  console.error(e);
  reply.textContent='AI 暫時沒有回應，請再試一次。';
  reply.classList.add('show');setTimeout(()=>reply.classList.remove('show'),3000);
 }finally{seal.disabled=false;clear.disabled=false}
};

['gesturestart','gesturechange','gestureend'].forEach(t=>c.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let tap=0;c.addEventListener('touchend',e=>{const n=Date.now();if(n-tap<320)e.preventDefault();tap=n},{passive:false});

const fw=document.getElementById('fireworks'),f=fw.getContext('2d');let raf;
function launchFireworks(){
 cancelAnimationFrame(raf);const W=fw.clientWidth,H=fw.clientHeight,d=Math.min(devicePixelRatio||1,2);
 fw.width=W*d;fw.height=H*d;f.setTransform(d,0,0,d,0,0);const a=[];
 for(let k=0;k<9;k++){const X=W*(.08+Math.random()*.84),Y=H*(.12+Math.random()*.45);
  for(let i=0;i<70;i++){const q=Math.random()*Math.PI*2,s=1.4+Math.random()*4.2;a.push({x:X,y:Y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,life:55+Math.random()*40})}}
 fw.classList.add('show');
 function go(){f.clearRect(0,0,W,H);let alive=false;
  for(const p of a)if(p.life>0){alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life--;f.globalAlpha=Math.max(0,p.life/95);f.beginPath();f.arc(p.x,p.y,2.2,0,Math.PI*2);f.fill()}
  f.globalAlpha=1;if(alive)raf=requestAnimationFrame(go);else fw.classList.remove('show')
 }go();
}
</script>
</body></html>
